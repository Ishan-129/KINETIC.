<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141925"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="l-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C9922A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9B6E1A" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="l-pillar" x1="14" y1="12" x2="22" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#E8B84B"/>
      <stop offset="100%" stop-color="#C9922A"/>
    </linearGradient>
    <linearGradient id="l-chevron" x1="28" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5CC"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#E8B84B"/>
      <stop offset="100%" stop-color="#9B6E1A"/>
    </linearGradient>
  </defs>

  <!-- Mark Badge -->
  <g transform="translate(0, 0)">
    <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#l-bg)" stroke="url(#l-border)" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="20" fill="#C9922A" opacity="0.08"/>
    <rect x="14" y="13" width="8" height="38" rx="4" fill="url(#l-pillar)"/>
    <path d="M 48 14 L 29.5 32 L 48 50" stroke="url(#l-chevron)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="76" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#0F131D" letter-spacing="-0.5">
    KINETIC<tspan fill="#C9922A">.</tspan>
  </text>
  <text x="76" y="48" font-family="'JetBrains Mono', monospace, Courier" font-weight="600" font-size="9.5" fill="#64748B" letter-spacing="2">
    DIGITAL GROWTH STUDIO
  </text>
</svg>
