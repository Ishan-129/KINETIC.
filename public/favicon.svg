<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sharp Box Container -->
  <rect x="1.5" y="1.5" width="61" height="61" fill="#0D1117" stroke="#C7FF3D" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Ambient Top Glow -->
  <rect x="2" y="2" width="60" height="12" fill="#C7FF3D" fill-opacity="0.08"/>

  <!-- Kinetic MT Monogram -->
  <g stroke-linecap="square" stroke-linejoin="miter">
    <!-- M Glyph — Acid Green -->
    <path d="M 13 47 L 13 17 L 23.5 31.5 L 34 17 L 34 47" stroke="#C7FF3D" stroke-width="4.5"/>
    
    <!-- T Glyph — Off-White -->
    <path d="M 33 17 L 51 17" stroke="#ECEEF2" stroke-width="4.5"/>
    <path d="M 42 17 L 42 47" stroke="#ECEEF2" stroke-width="4.5"/>
  </g>

  <!-- Acid Accent Dot -->
  <rect x="48" y="43" width="4" height="4" fill="#C7FF3D"/>
</svg>
